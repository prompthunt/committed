name: CommitStandings
# Describes CommitStandings.xcodeproj; it is NOT used to regenerate it. Regenerating would
# reset the Mac app's Info.plist, entitlements, and Sparkle setup. The pbxproj is the source of
# truth: edit it with Xcode or the xcodeproj gem (scripts/xcode-add-files.rb) and keep this file
# in step by hand.
options:
  bundleIdPrefix: com.addisonk
  deploymentTarget:
    macOS: "26.0"
    iOS: "27.1"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2

targets:
  CommitStandings:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: CommitStandings
        excludes: # iPhone app + Live rank extension only
          - Store/LiveRankAttributes.swift # ActivityKit
          - Support/CommittedTheme.swift # iPhone theme; the Mac keeps its own look
          - Support/AvatarCache.swift # App Group avatars for Live rank; the Mac has no App Group
    dependencies:
      - package: Sparkle
        product: Sparkle
    # Use the checked-in Info.plist and entitlements as the sole source of truth.
    # Generating them here would reset the version, updater settings, and sandbox.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandings
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CommitStandings/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommitStandings/CommitStandings.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  CommitStandingsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: CommitStandingsTests
    dependencies:
      - target: CommitStandings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandingsTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CommitStandings.app/Contents/MacOS/CommitStandings"

  # Committed for iPhone. Its own folder is a filesystem-synchronized group; the shared core
  # below is the same files the Mac app compiles (multiple target membership, no package).
  CommitStandingsiOS:
    type: application
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: CommitStandingsiOS
        excludes: [Info.plist]
      - path: CommitStandings/Models
      - path: CommitStandings/Services/ContributionsClient.swift
      - path: CommitStandings/Services/ContributionsParser.swift
      - path: CommitStandings/Services/ContributionHistory.swift
      - path: CommitStandings/Services/GitHubAccountClient.swift
      - path: CommitStandings/Services/GitHubAuth.swift
      - path: CommitStandings/Services/GitHubConfig.swift
      - path: CommitStandings/Services/GitHubCredentialStore.swift
      - path: CommitStandings/Services/NotificationService.swift
      - path: CommitStandings/Store
      - path: CommitStandings/Support
      - path: CommitStandings/Views/StandingRow.swift
      - path: CommitStandings/Views/StandingRowStyle.swift
      - path: CommitStandings/Views/AvatarView.swift
      - path: CommitStandings/Views/RosterStatusView.swift
      - path: CommitStandings/Views/ContributionWindowPicker.swift
      - path: CommitStandings/Views/PrivateContributionsTip.swift
      - path: CommitStandings/Views/ContributionsExplainerView.swift
    dependencies:
      - target: CommitStandingsLiveRank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandings.iOS
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CommitStandingsiOS/Info.plist # committed:// deep links, background app refresh
        INFOPLIST_KEY_CFBundleDisplayName: Committed
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CommitStandingsiOS/CommitStandingsiOS.entitlements # App Group group.com.addisonk.CommitStandings, aps-environment
        # Committed relay (Live rank phase 2), read through Info.plist. Empty URL = phase 1 only.
        COMMITTED_RELAY_URL: ""
      configs:
        Debug:
          COMMITTED_APNS_ENVIRONMENT: sandbox
        Release:
          COMMITTED_APNS_ENVIRONMENT: production

  # Live rank: WidgetKit extension holding only the Live Activity, embedded in the iOS app.
  CommitStandingsLiveRank:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: CommitStandingsLiveRank
        excludes: [Info.plist]
      # Shared with the app: the Live rank contract, the Board deep link, and the board's row
      # (StandingRow is never forked) with the avatars it reads from the App Group.
      - path: CommitStandings/Store/LiveRankState.swift
      - path: CommitStandings/Store/LiveRankAttributes.swift
      - path: CommitStandings/Support/DeepLink.swift
      - path: CommitStandings/Support/CommittedTheme.swift
      - path: CommitStandings/Support/AvatarCache.swift
      - path: CommitStandings/Support/AvatarColor.swift
      - path: CommitStandings/Models/Standing.swift
      - path: CommitStandings/Models/Competitor.swift
      - path: CommitStandings/Views/StandingRow.swift
      - path: CommitStandings/Views/StandingRowStyle.swift
      - path: CommitStandings/Views/AvatarView.swift
      # The widgets' own 15-minute refresh: refetch public contribution counts and re-rank.
      - path: CommitStandings/Store/WidgetSnapshot.swift
      - path: CommitStandings/Store/WidgetRefresh.swift
      - path: CommitStandings/Store/Ranking.swift
      - path: CommitStandings/Store/LiveRankDerivation.swift
      - path: CommitStandings/Services/ContributionsClient.swift
      - path: CommitStandings/Services/ContributionsParser.swift
      - path: CommitStandings/Services/ContributionHistory.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandings.iOS.LiveRank
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CommitStandingsLiveRank/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Live rank
        CODE_SIGN_ENTITLEMENTS: CommitStandingsLiveRank/CommitStandingsLiveRank.entitlements # App Group
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # iOS-only tests, hosted in the iOS app. Platform-neutral core tests stay in CommitStandingsTests.
  CommitStandingsiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: CommitStandingsiOSTests
    dependencies:
      - target: CommitStandingsiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandings.iOSTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CommitStandingsiOS.app/CommitStandingsiOS"

schemes:
  CommitStandings:
    build:
      targets:
        CommitStandings: all
        CommitStandingsTests: [test]
    test:
      targets:
        - CommitStandingsTests
      gatherCoverageData: true
    run:
      config: Debug
  CommitStandingsiOS:
    build:
      targets:
        CommitStandingsiOS: all
        CommitStandingsiOSTests: [test]
    test:
      targets:
        - CommitStandingsiOSTests
      gatherCoverageData: true
    run:
      config: Debug
