name: CommitStandings
options:
  bundleIdPrefix: com.addisonk
  deploymentTarget:
    macOS: "26.0"
    iOS: "27.1"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2

targets:
  CommitStandings:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: CommitStandings
    dependencies:
      - package: Sparkle
        product: Sparkle
    # Use the checked-in Info.plist and entitlements as the sole source of truth.
    # Generating them here would reset the version, updater settings, and sandbox.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandings
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CommitStandings/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommitStandings/CommitStandings.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  CommitStandingsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: CommitStandingsTests
    dependencies:
      - target: CommitStandings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandingsTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CommitStandings.app/Contents/MacOS/CommitStandings"

  # Committed for iPhone (spec #39). DO NOT regenerate the project from this file: it
  # predates the iOS targets and could reset the Mac Info.plist, entitlements, or Sparkle
  # setup. The pbxproj is edited with the `xcodeproj` gem; this file only describes it.
  # Shared core files are members of both CommitStandings and CommitStandingsiOS.
  CommitStandingsiOS:
    type: application
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: CommitStandingsiOS
        excludes:
          - Info.plist  # merged into the generated Info.plist via INFOPLIST_FILE, not a resource
      - path: CommitStandings/Models
      - path: CommitStandings/Store
      - path: CommitStandings/Support
      - path: CommitStandings/Services/ContributionsClient.swift
      - path: CommitStandings/Services/ContributionsParser.swift
      - path: CommitStandings/Services/GitHubAccountClient.swift
      - path: CommitStandings/Services/GitHubAuth.swift
      - path: CommitStandings/Services/GitHubConfig.swift
      - path: CommitStandings/Services/GitHubCredentialStore.swift
      - path: CommitStandings/Services/NotificationService.swift
      - path: CommitStandings/Views/StandingRow.swift
      - path: CommitStandings/Views/AvatarView.swift
      - path: CommitStandings/Views/RosterStatusView.swift
      - path: CommitStandings/Views/PrivateContributionsTip.swift
      - path: CommitStandings/Views/ContributionsExplainer.swift
    dependencies:
      - target: CommitStandingsLiveRank
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandings.iOS
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.51"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CommitStandingsiOS/Info.plist  # CFBundleURLTypes (committed://), BGTaskSchedulerPermittedIdentifiers, UIBackgroundModes fetch
        INFOPLIST_KEY_CFBundleDisplayName: Committed
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: CommitStandingsiOS/CommitStandingsiOS.entitlements  # App Group group.com.addisonk.CommitStandings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CommitStandingsLiveRank:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: CommitStandingsLiveRank
      # The Live rank contract, shared with the app (LiveRankState is also in the Mac target).
      - path: CommitStandingsiOS/LiveRankAttributes.swift
      - path: CommitStandings/Store/LiveRankState.swift
      - path: CommitStandings/Models/Standing.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandings.iOS.LiveRank
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.51"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CommitStandingsLiveRank/Info.plist  # NSExtensionPointIdentifier = com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: CommitStandingsLiveRank/CommitStandingsLiveRank.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  CommitStandingsiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: CommitStandingsiOSTests
    dependencies:
      - target: CommitStandingsiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addisonk.CommitStandings.iOSTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CommitStandingsiOS.app/CommitStandingsiOS"

schemes:
  CommitStandings:
    build:
      targets:
        CommitStandings: all
        CommitStandingsTests: [test]
    test:
      targets:
        - CommitStandingsTests
      gatherCoverageData: true
    run:
      config: Debug

  # Separate shared iOS scheme. The CommitStandings scheme stays Mac-only (CI runs it on Xcode 26).
  CommitStandingsiOS:
    build:
      targets:
        CommitStandingsiOS: all
        CommitStandingsiOSTests: [test]
    test:
      targets:
        - CommitStandingsiOSTests
      gatherCoverageData: true
    run:
      config: Debug
