name: Prepare Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: rustup default stable
      - run: npm ci
      - run: npm run version:check
      - run: npm run test:core
      - run: npm test
      - name: Build unsigned installer with a Tauri updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing Tauri updater key' }
          npm run tauri -- build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-assets.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: windows/release/*
          if-no-files-found: error
